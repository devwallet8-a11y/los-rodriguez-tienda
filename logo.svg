<svg viewBox="0 0 500 550" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      .main-text { font-family: 'Brush Script MT', cursive; font-weight: bold; font-style: italic; }
      .tienda-text { font-family: 'Arial Black', sans-serif; font-weight: 900; letter-spacing: 2px; }
      .tagline-text { font-family: Arial, sans-serif; font-weight: bold; }
    </style>
  </defs>
  
  <!-- Outer circle with border -->
  <circle cx="250" cy="260" r="240" fill="#f5deb3" stroke="#8b0000" stroke-width="12"/>
  <circle cx="250" cy="260" r="225" fill="none" stroke="#001a4d" stroke-width="4"/>
  <circle cx="250" cy="260" r="220" fill="none" stroke="#8b0000" stroke-width="2"/>
  
  <!-- Sky gradient background -->
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6db3d8;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Sky -->
  <ellipse cx="250" cy="140" rx="180" ry="120" fill="url(#skyGrad)"/>
  
  <!-- Palm tree on left - detailed -->
  <g transform="translate(80, 120)">
    <!-- Trunk -->
    <rect x="-5" y="30" width="10" height="100" fill="#8b6914" rx="2"/>
    <path d="M -5 30 Q -8 40 -5 50 Q 0 60 5 50 Q 8 40 5 30" fill="#9d7e1a"/>
    <!-- Fronds - more detailed -->
    <path d="M 0 25 Q -35 -15 -50 -45" stroke="#1a3a2a" stroke-width="3" fill="none"/>
    <path d="M -8 20 Q -40 -20 -55 -50" stroke="#1a3a2a" stroke-width="2" fill="none"/>
    <path d="M 8 20 Q 40 -20 55 -50" stroke="#1a3a2a" stroke-width="2" fill="none"/>
    <path d="M 0 25 Q 35 -15 50 -45" stroke="#1a3a2a" stroke-width="3" fill="none"/>
    <path d="M -5 35 Q -40 0 -58 -20" stroke="#1a3a2a" stroke-width="2" fill="none"/>
    <path d="M 5 35 Q 40 0 58 -20" stroke="#1a3a2a" stroke-width="2" fill="none"/>
    <!-- Frond fill -->
    <ellipse cx="-40" cy="-25" rx="18" ry="35" fill="#1a3a2a" opacity="0.8" transform="rotate(-35 -40 -25)"/>
    <ellipse cx="40" cy="-25" rx="18" ry="35" fill="#1a3a2a" opacity="0.8" transform="rotate(35 40 -25)"/>
    <ellipse cx="-50" cy="-5" rx="15" ry="30" fill="#1a3a2a" opacity="0.7" transform="rotate(-25 -50 -5)"/>
    <ellipse cx="50" cy="-5" rx="15" ry="30" fill="#1a3a2a" opacity="0.7" transform="rotate(25 50 -5)"/>
  </g>
  
  <!-- Capitol building in background right -->
  <g transform="translate(320, 80)">
    <!-- Main building -->
    <rect x="-40" y="20" width="80" height="70" fill="#d4af8f" stroke="#001a4d" stroke-width="2"/>
    <!-- Dome -->
    <circle cx="0" cy="15" r="25" fill="#a89d6f" stroke="#001a4d" stroke-width="1.5"/>
    <path d="M -25 15 Q -25 -10 0 -20 Q 25 -10 25 15" fill="#9d9663"/>
    <!-- Windows -->
    <rect x="-35" y="30" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="-20" y="30" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="-5" y="30" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="10" y="30" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="25" y="30" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <!-- Second row -->
    <rect x="-35" y="45" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="-20" y="45" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="-5" y="45" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="10" y="45" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <rect x="25" y="45" width="8" height="8" fill="#87ceeb" stroke="#001a4d" stroke-width="0.5"/>
    <!-- Flag pole -->
    <line x1="0" y1="-20" x2="0" y2="-35" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Cuban flag in background -->
  <g transform="translate(310, 45)">
    <rect x="0" y="0" width="30" height="18" fill="#8b0000"/>
    <path d="M 0 0 L 30 18 L 30 0 Z" fill="#ffffff"/>
    <path d="M 0 18 L 30 0 L 0 0 Z" fill="#ffffff"/>
    <circle cx="15" cy="9" r="5" fill="#001a4d"/>
  </g>
  
  <!-- Store front - Main element -->
  <g transform="translate(250, 240)">
    <!-- Store building -->
    <rect x="-60" y="-50" width="120" height="100" fill="#e8d4b8" stroke="#001a4d" stroke-width="3" rx="2"/>
    
    <!-- Awning - red and white stripes -->
    <g>
      <rect x="-60" y="-50" width="120" height="30" fill="#8b0000" stroke="#001a4d" stroke-width="1"/>
      <!-- Stripes -->
      <rect x="-60" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="-44" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="-28" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="-12" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="4" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="20" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="36" y="-50" width="8" height="30" fill="#ffffff"/>
      <rect x="52" y="-50" width="8" height="30" fill="#ffffff"/>
      <!-- Curved awning edge -->
      <path d="M -60 -20 Q -60 -35 -50 -50 L 50 -50 Q 60 -35 60 -20" fill="#8b0000" stroke="#001a4d" stroke-width="2"/>
    </g>
    
    <!-- Store window/display -->
    <rect x="-55" y="-18" width="110" height="55" fill="#2a2a2a" stroke="#001a4d" stroke-width="2" rx="2"/>
    
    <!-- Bottles display in window - varied heights and colors -->
    <rect x="-45" y="-8" width="6" height="25" fill="#8b4513" rx="1"/>
    <rect x="-37" y="-10" width="6" height="28" fill="#a0522d" rx="1"/>
    <rect x="-29" y="-6" width="6" height="23" fill="#8b4513" rx="1"/>
    <rect x="-21" y="-12" width="6" height="32" fill="#d2691e" rx="1"/>
    <rect x="-13" y="-8" width="6" height="26" fill="#8b4513" rx="1"/>
    <rect x="-5" y="-9" width="6" height="27" fill="#a0522d" rx="1"/>
    <rect x="3" y="-7" width="6" height="25" fill="#8b4513" rx="1"/>
    <rect x="11" y="-11" width="6" height="30" fill="#d2691e" rx="1"/>
    <rect x="19" y="-8" width="6" height="26" fill="#8b4513" rx="1"/>
    <rect x="27" y="-10" width="6" height="28" fill="#a0522d" rx="1"/>
    <rect x="35" y="-6" width="6" height="24" fill="#8b4513" rx="1"/>
    <rect x="43" y="-9" width="6" height="27" fill="#d2691e" rx="1"/>
    
    <!-- Bottle caps/labels -->
    <circle cx="-42" cy="-10" r="4" fill="#c41e3a"/>
    <circle cx="-34" cy="-12" r="4" fill="#c41e3a"/>
    <circle cx="-26" cy="-8" r="4" fill="#c41e3a"/>
    <circle cx="-18" cy="-14" r="4" fill="#c41e3a"/>
    <circle cx="-10" cy="-10" r="4" fill="#c41e3a"/>
    <circle cx="-2" cy="-11" r="4" fill="#c41e3a"/>
    <circle cx="6" cy="-9" r="4" fill="#c41e3a"/>
    <circle cx="14" cy="-13" r="4" fill="#c41e3a"/>
    <circle cx="22" cy="-10" r="4" fill="#c41e3a"/>
    <circle cx="30" cy="-12" r="4" fill="#c41e3a"/>
    <circle cx="38" cy="-8" r="4" fill="#c41e3a"/>
    <circle cx="46" cy="-11" r="4" fill="#c41e3a"/>
    
    <!-- Sign "TIENDA" at top -->
    <rect x="-45" y="-42" width="90" height="18" fill="#f5deb3" stroke="#001a4d" stroke-width="1.5" rx="2"/>
    <text x="0" y="-27" text-anchor="middle" class="tienda-text" font-size="16" fill="#c41e3a">TIENDA</text>
    
    <!-- Stars on sign -->
    <polygon points="-50,-35 -48,-31 -44,-31 -46,-27 -44,-23 -50,-27 -56,-23 -54,-27 -56,-31 -52,-31" fill="#001a4d"/>
    <polygon points="50,-35 52,-31 56,-31 54,-27 56,-23 50,-27 44,-23 46,-27 44,-31 48,-31" fill="#001a4d"/>
    
    <!-- "DE TODO, COMO EN CASA" sign -->
    <text x="0" y="25" text-anchor="middle" class="tagline-text" font-size="9" fill="#001a4d">DE TODO,</text>
    <text x="0" y="36" text-anchor="middle" class="tagline-text" font-size="9" fill="#001a4d">COMO EN CASA</text>
  </g>
  
  <!-- Classic 1950s car on right side -->
  <g transform="translate(380, 300)">
    <!-- Main body -->
    <ellipse cx="0" cy="0" rx="45" ry="20" fill="#003d5c" stroke="#001a4d" stroke-width="2"/>
    <!-- Cabin/top -->
    <ellipse cx="0" cy="-15" rx="32" ry="16" fill="#003d5c" stroke="#001a4d" stroke-width="2"/>
    <!-- Front bumper -->
    <rect x="42" y="-8" width="8" height="16" fill="#c41e3a" stroke="#001a4d" stroke-width="1"/>
    <!-- Rear bumper -->
    <rect x="-50" y="-8" width="8" height="16" fill="#c41e3a" stroke="#001a4d" stroke-width="1"/>
    <!-- Wheels -->
    <circle cx="-25" cy="22" r="10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <circle cx="25" cy="22" r="10" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Wheel rims -->
    <circle cx="-25" cy="22" r="6" fill="#c0c0c0"/>
    <circle cx="25" cy="22" r="6" fill="#c0c0c0"/>
    <!-- Windows -->
    <ellipse cx="-12" cy="-18" rx="10" ry="8" fill="#87ceeb" stroke="#001a4d" stroke-width="1"/>
    <ellipse cx="12" cy="-18" rx="10" ry="8" fill="#87ceeb" stroke="#001a4d" stroke-width="1"/>
    <!-- Headlights -->
    <circle cx="45" cy="-4" r="4" fill="#ffff99" stroke="#333" stroke-width="0.5"/>
    <circle cx="45" cy="4" r="4" fill="#ffff99" stroke="#333" stroke-width="0.5"/>
    <!-- Grill -->
    <line x1="40" y1="-2" x2="50" y2="-2" stroke="#333" stroke-width="0.5"/>
    <line x1="40" y1="0" x2="50" y2="0" stroke="#333" stroke-width="0.5"/>
    <line x1="40" y1="2" x2="50" y2="2" stroke="#333" stroke-width="0.5"/>
  </g>
  
  <!-- Main title "Los Rodríguez" - Large and prominent -->
  <text x="250" y="380" text-anchor="middle" class="main-text" font-size="72" fill="#c41e3a" stroke="#ffffff" stroke-width="2">Los Rodríguez</text>
  <text x="250" y="380" text-anchor="middle" class="main-text" font-size="72" fill="#c41e3a">Los Rodríguez</text>
  
  <!-- Decorative underline -->
  <path d="M 120 395 Q 250 410 380 395" stroke="#001a4d" stroke-width="3" fill="none"/>
  
  <!-- TIENDA text -->
  <text x="250" y="430" text-anchor="middle" class="tienda-text" font-size="20" fill="#001a4d">★ TIENDA ★</text>
  
  <!-- Tagline at bottom -->
  <text x="250" y="455" text-anchor="middle" class="tagline-text" font-size="13" fill="#001a4d" letter-spacing="1">DE TODO, COMO EN CASA</text>
  
  <!-- Decorative stars -->
  <polygon points="110,150 112,156 118,156 113,160 115,166 110,162 105,166 107,160 102,156 108,156" fill="#c41e3a"/>
  <polygon points="390,160 392,166 398,166 393,170 395,176 390,172 385,176 387,170 382,166 388,166" fill="#c41e3a"/>
  <polygon points="390,400 392,406 398,406 393,410 395,416 390,412 385,416 387,410 382,406 388,406" fill="#c41e3a"/>
  <polygon points="110,410 112,416 118,416 113,420 115,426 110,422 105,426 107,420 102,416 108,416" fill="#c41e3a"/>
  
</svg>